<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Board | Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container { 
            width: 100%;
            max-width: 900px; 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); 
        }

        h2, h3 { margin-top: 0; color: var(--text-main); font-weight: 600; }
        
        /* Auth Box Style */
        .auth-box { 
            max-width: 400px; 
            margin: auto; 
            text-align: center;
        }

        input { 
            width: 100%;
            padding: 12px 16px; 
            margin: 10px 0; 
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        button { 
            width: 100%;
            padding: 12px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover { background: var(--primary-hover); transform: translateY(-1px); }

        /* Task Items */
        .task-item { 
            background: #fff;
            border: 1px solid var(--border);
            padding: 15px; 
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .task-info { display: flex; flex-direction: column; }
        .task-title { font-weight: 600; font-size: 16px; }
        .task-status { font-size: 12px; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Admin Table */
        .admin-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid var(--border);
        }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th { text-align: left; padding: 12px; background: #f1f5f9; color: var(--text-sub); }
        td { padding: 12px; border-bottom: 1px solid var(--border); }

        .badge-admin { background: #fee2e2; color: #b91c1c; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-sub); width: auto; padding: 6px 12px; }
        .btn-outline:hover { background: #f1f5f9; color: var(--text-main); }
        
        .delete-btn { background: var(--danger); width: auto; font-size: 12px; padding: 6px 12px; }
        .approve-btn { background: var(--success); width: auto; font-size: 12px; padding: 6px 12px; margin-right: 5px; }

        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="auth-section" class="auth-box">
            <div id="login-form">
                <h2>👋 Welcome Back</h2>
                <p style="color: var(--text-sub);">Please enter your details</p>
                <input type="email" id="email" placeholder="Email address">
                <input type="password" id="password" placeholder="Password">
                <button onclick="login()">Sign In</button>
                <p style="font-size: 14px; color: var(--text-sub); margin-top: 20px;">
                    Don't have an account? <a href="#" onclick="toggleAuth(true)" style="color: var(--primary); text-decoration: none;">Create one</a>
                </p>
            </div>

            <div id="register-form" style="display:none;">
                <h2>✨ Create Account</h2>
                <input type="text" id="regUsername" placeholder="Username">
                <input type="email" id="regEmail" placeholder="Email address">
                <input type="password" id="regPassword" placeholder="Password">
                <button onclick="register()">Register</button>
                <p style="font-size: 14px; color: var(--text-sub); margin-top: 20px;">
                    Already have an account? <a href="#" onclick="toggleAuth(false)" style="color: var(--primary); text-decoration: none;">Log in</a>
                </p>
            </div>
        </div>

        <div id="task-section" style="display:none;">
            <div class="header-flex">
                <div>
                    <h2 style="margin-bottom: 5px;">🚀 Project Board</h2>
                    <span style="color: var(--text-sub);">User: <b id="user-display" style="color: var(--primary);"></b></span>
                </div>
                <button onclick="logout()" class="btn-outline">Sign Out</button>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 30px; background: #f1f5f9; padding: 15px; border-radius: 12px;">
                <input type="text" id="taskTitle" placeholder="What needs to be done?" style="margin:0; flex-grow: 1;">
                <button onclick="addTask()" style="width: 120px; margin:0;">+ Add Task</button>
            </div>
            
            <div id="taskList"></div>
            
            <div id="admin-section" class="admin-section" style="display:none;">
                <h3 style="display: flex; align-items: center; gap: 10px;">
                    🛡️ Admin Control Panel
                </h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="userList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script>
    // --- Logic เหมือนเดิมที่คุณเขียนไว้ (Script เดิมใช้งานได้ปกติ) ---
    const API_AUTH = '/api/auth';
    const API_TASKS = '/api/tasks';

    function toggleAuth(isRegister) {
        document.getElementById('login-form').style.display = isRegister ? 'none' : 'block';
        document.getElementById('register-form').style.display = isRegister ? 'block' : 'none';
    }

    async function register() {
        const username = document.getElementById('regUsername').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        if(!username || !email || !password) return alert('กรุณากรอกข้อมูลให้ครบ');

        try {
            const res = await fetch(`${API_AUTH}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });

            if (res.ok) {
                alert('สมัครสมาชิกสำเร็จ!');
                toggleAuth(false);
            } else {
                const data = await res.json();
                alert('Error: ' + data.error);
            }
        } catch (err) { alert('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'); }
    }

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const res = await fetch(`${API_AUTH}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('role', data.user.role); 
                
                document.getElementById('user-display').innerText = data.user.username;
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('task-section').style.display = 'block';

                if (data.user.role === 'admin') {
                    document.getElementById('admin-section').style.display = 'block';
                    loadUsers();
                }
                loadTasks();
            } else {
                alert('Login Failed: ตรวจสอบ Email/Password');
            }
        } catch (err) { alert('Login Error: ' + err); }
    }

    async function loadTasks() {
        try {
            const res = await fetch(API_TASKS);
            const tasks = await res.json();
            const list = document.getElementById('taskList');
            const currentRole = localStorage.getItem('role');

            list.innerHTML = tasks.map(t => `
                <div class="task-item">
                    <div class="task-info">
                        <span class="task-title">${t.title}</span>
                        <span class="task-status" style="color: ${t.status === 'Approved' ? 'var(--success)' : 'var(--warning)'}">
                            ● ${t.status}
                        </span>
                    </div>
                    <div>
                        ${currentRole === 'admin' && t.status !== 'Approved' ? 
                            `<button class="approve-btn" onclick="approveTask(${t.id})">Approve</button>` : ''}
                        ${currentRole === 'admin' ? 
                            `<button class="delete-btn" onclick="deleteTask(${t.id})">Delete</button>` : ''}
                    </div>
                </div>
            `).join('');
        } catch (e) {}
    }

    async function deleteTask(id) {
        if (!confirm(`ลบงานนี้?`)) return;
        const res = await fetch(`${API_TASKS}/${id}`, { method: 'DELETE' });
        if (res.ok) loadTasks();
    }

    async function approveTask(id) {
        const res = await fetch(`${API_TASKS}/${id}/approve`, { method: 'PATCH' });
        if (res.ok) loadTasks();
    }

    async function loadUsers() {
        const res = await fetch(`${API_AUTH}/users`);
        const users = await res.json();
        const list = document.getElementById('userList');
        list.innerHTML = users.map(u => `
            <tr>
                <td>${u.username}</td>
                <td style="color: var(--text-sub)">${u.email}</td>
                <td>${u.role === 'admin' ? '<span class="badge-admin">ADMIN</span>' : 'User'}</td>
                <td>
                    ${u.role !== 'admin' ? `<button class="delete-btn" onclick="deleteUser(${u.id})">ลบ</button>` : '-'}
                </td>
            </tr>
        `).join('');
    }

    async function deleteUser(id) {
        if (confirm('ยืนยันลบผู้ใช้?')) {
            const res = await fetch(`${API_AUTH}/users/${id}`, { method: 'DELETE' });
            if (res.ok) loadUsers();
        }
    }

    async function addTask() {
        const title = document.getElementById('taskTitle').value;
        if (!title) return;
        const token = localStorage.getItem('token');
        await fetch(API_TASKS, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ title })
        });
        document.getElementById('taskTitle').value = '';
        loadTasks();
    }

    function logout() {
        localStorage.clear();
        location.reload();
    }
</script>
</body>
</html>
